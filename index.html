<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favour's Adventure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-wrap">
  <h1>⚔️ Favour's Adventure</h1>
  <div class="hud">
    <span>⭐ Score: <b id="score">0</b></span>
    <span>❤️ Health: <b id="health">3</b></span>
    <span>🌍 Level: <b id="level">1</b></span>
  </div>
  <canvas id="game" width="900" height="500"></canvas>
  <p id="message">Reach the portal! Collect stars and avoid enemies.</p>
  <div class="controls">
    <button data-key="ArrowLeft">⬅️</button>
    <button data-key="ArrowRight">➡️</button>
    <button data-key="ArrowUp">⬆️</button>
    <button id="restart">🔄</button>
  </div>
  <p class="hint">Desktop: Arrow keys • R = restart</p>
</div>
<script src="game.js"></script>
</body>
</html>
